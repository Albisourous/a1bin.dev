<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      href="/fonts/mononoki-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/mononoki-Bold.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Albin Shrestha — software engineer in Seattle. Amazon Customer Service, LLM widgets, agent tooling. Personal site rendered as an IDE."
    />
    <title>Albin Shrestha — a1bin.dev</title>
    <link rel="canonical" href="https://a1bin.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://a1bin.dev/" />
    <meta property="og:site_name" content="a1bin.dev" />
    <meta property="og:title" content="Albin Shrestha — a1bin.dev" />
    <meta
      property="og:description"
      content="Albin Shrestha — software engineer in Seattle. Amazon Customer Service, LLM widgets, agent tooling. Personal site rendered as an IDE."
    />
    <meta property="og:image" content="https://a1bin.dev/og.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Albin Shrestha",
        "url": "https://a1bin.dev/",
        "image": "https://a1bin.dev/og.png",
        "jobTitle": "Software Engineer",
        "address": { "@type": "PostalAddress", "addressLocality": "Seattle", "addressRegion": "WA" },
        "sameAs": [
          "https://github.com/Albisourous",
          "https://www.linkedin.com/in/albin-shrestha",
          "https://x.com/albinshr"
        ]
      }
    </script>
    <script>
      // Set theme before first paint; default dark.
      // ?theme=dark|light overrides localStorage for shareable links.
      try {
        var t =
          new URLSearchParams(location.search).get("theme") ||
          localStorage.getItem("a1-theme");
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Pre-render fallback: crawlers see this before React mounts,
           and React replaces it on first render. Keep it in sync with
           the meta description above. -->
      <h1>Albin Shrestha</h1>
      <p>
        Albin Shrestha — software engineer in Seattle. Amazon Customer Service, LLM widgets, agent tooling. Personal site rendered as an IDE.
      </p>
      <nav>
        <a href="https://github.com/Albisourous">GitHub</a>
        <a href="https://www.linkedin.com/in/albin-shrestha">LinkedIn</a>
        <a href="https://x.com/albinshr">X</a>
      </nav>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
