    <script>
      // Set theme before first paint; default dark.
      // ?theme=dark|light overrides localStorage for shareable links.
      try {
        var t =
          new URLSearchParams(location.search).get("theme") ||
          localStorage.getItem("a1-theme");
        if (t === "light" || t === "dark")
          document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <script>
      // Canonical follows the deep link — the SPA serves this same
      // index.html on every route, so set it before React boots.
      // React keeps it in sync as the active tab changes (App.jsx).
      try {
        var p = location.pathname.replace(/\/+$/, "");
        if (p)
          document
            .querySelector('link[rel="canonical"]')
            .setAttribute("href", "https://a1bin.dev" + p);
      } catch (e) {}
    </script>
    <style>

      .crawl {
